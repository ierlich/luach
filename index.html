<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102d2a"><title>הלוח שלי</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body>
<header><div><div class="eyebrow">הלוח שלי</div><h1 id="monthTitle">טוען…</h1></div><button id="todayBtn" class="pill">היום</button></header>
<main><section class="hero"><div><div id="todayHeb" class="bigHeb">—</div><div id="todayGreg">—</div><div id="todayLearning" class="muted">—</div></div><div class="sun"><span>שקיעה</span><strong id="sunset">—</strong></div></section>
<section class="toolbar"><button id="prev">‹</button><button id="locationBtn">📍 <span id="locationName">וינה</span></button><button id="googleBtn">🗓️ Google</button><button id="next">›</button></section>
<section class="calendar"><div class="week"><b>א׳</b><b>ב׳</b><b>ג׳</b><b>ד׳</b><b>ה׳</b><b>ו׳</b><b>שבת</b></div><div id="grid" class="grid"></div></section>
<p class="credit">נתוני הלוח והזמנים: Hebcal</p></main>
<dialog id="dayDialog"><button class="close" onclick="this.closest('dialog').close()">×</button><div id="dayContent"></div></dialog>
<dialog id="locationDialog"><button class="close" onclick="this.closest('dialog').close()">×</button><h2>שינוי מיקום</h2><form id="locationForm"><label>שם עיר<input id="cityInput" placeholder="למשל: Jerusalem, London, Vienna" required></label><button class="primary">מצא עיר</button></form><div id="locationResults"></div></dialog>
<dialog id="googleDialog"><button class="close" onclick="this.closest('dialog').close()">×</button><h2>Google Calendar</h2><p>האפליקציה מוכנה להציג את אירועי Google Calendar בתוך הלוח.</p><p class="muted">לאחר פרסום האתר נוסיף Google OAuth Client ID עבור כתובת האתר. החיבור יהיה לקריאה בלבד.</p><label>Google Client ID<input id="clientId" placeholder="...apps.googleusercontent.com"></label><button id="saveClient" class="primary">שמור והפעל חיבור</button><div id="googleStatus"></div></dialog>
<script src="app.js"></script></body></html>
