name: Build PWA icons
on:
  push:
    branches: [main]
    paths:
      - icon.png
      - .github/workflows/build-icons.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create standard PWA icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          convert icon.png -resize 192x192 icon-192.png
          convert icon.png -resize 512x512 icon-512.png
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          git diff --cached --quiet || git commit -m "Generate standard PWA icon sizes"
          git push
